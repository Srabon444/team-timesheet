name: Release Linux

# Fully automated: any push to this branch that touches desktop/ builds and
# publishes a new release, tagged with a run-number so it's always unique.
# After publishing, only the newest linux-v* release+tag is kept — older
# ones are deleted automatically.
on:
  push:
    branches: ["desktop-linux"]
    paths: ["desktop/**", ".github/workflows/release-linux.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install

      - name: Run tests
        working-directory: desktop
        run: npm test

      - name: Compute release tag
        id: tag
        # Tag stays prefixed (linux-v…) for uniqueness + the keep-latest
        # cleanup filter; the visible release NAME is plain semver.
        run: |
          echo "tag=linux-v0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=v0.0.${{ github.run_number }} (Linux)" >> "$GITHUB_OUTPUT"

      # tauri.conf.json's version was a static "0.1.0" — every build produced
      # identically-named installer files no matter how many releases had
      # shipped since, so a downloaded file couldn't be told apart from an
      # older one. Bump it to the same run-number the release tag/name
      # already use, so the bundle filenames (e.g. team-timesheet_0.0.87_
      # amd64.deb) carry a version that actually changes every release.
      - name: Set app version to match the release
        run: |
          jq --arg v "0.0.${{ github.run_number }}" '.version = $v' \
            desktop/src-tauri/tauri.conf.json > /tmp/tauri.conf.json.tmp
          mv /tmp/tauri.conf.json.tmp desktop/src-tauri/tauri.conf.json

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Google Drive OAuth client secret, compiled in via option_env! —
          # kept out of source; set as a repo Actions secret.
          GD_CLIENT_SECRET: ${{ secrets.GD_CLIENT_SECRET }}
        with:
          projectPath: desktop
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: ${{ steps.tag.outputs.name }}
          releaseBody: "Linux build: .deb and .AppImage attached."
          releaseDraft: false
          prerelease: false

      # Keep exactly the tag we just published. The old createdAt sort
      # deleted the FRESH release when its createdAt hadn't populated yet in
      # `gh release list` (replication lag sorts it first, .[:-1] then picks
      # it). Keying off the published tag is immune to that race.
      - name: Keep only the latest Linux release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ steps.tag.outputs.tag }}
        run: |
          gh release view "$KEEP" >/dev/null
          gh release list --json tagName --jq \
            '.[] | select(.tagName | startswith("linux-v")) | .tagName' \
            | while read -r t; do
                if [ -n "$t" ] && [ "$t" != "$KEEP" ]; then
                  #! --cleanup-tag hard-fails when the tag ref is already gone -- a cancelled run
                  #! can leave a release whose tag was already removed -- and `bash -e` then kills
                  #! the whole cleanup mid-loop, stranding every older release behind it.
                  gh release delete "$t" --yes || true
                  gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$t" >/dev/null 2>&1 || true
                fi
              done
